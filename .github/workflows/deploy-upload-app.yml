name: Azure Static Web Apps - Upload App

on:
  push:
    branches:
      - main
    paths:
      - 'azure-upload-file-to-storage/**'
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main
    paths:
      - 'azure-upload-file-to-storage/**'
  workflow_dispatch:

jobs:
  validate:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: './azure-upload-file-to-storage/app/package-lock.json'

      - name: Validate App
        working-directory: ./azure-upload-file-to-storage/app
        run: |
          npm ci
          npm run build

      - name: Validate API
        working-directory: ./azure-upload-file-to-storage/api
        run: |
          npm ci
          npm run build

  build_and_deploy_job:
    needs: validate
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_UPLOAD_APP }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/azure-upload-file-to-storage/app"
          api_location: "/azure-upload-file-to-storage/api"
          output_location: "dist"
        env:
          SKIP_DEPLOY_ON_MISSING_SECRETS: true
          VITE_API_SERVER: "" # Handled by SWA proxy in production

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_UPLOAD_APP }}
          action: "close"
